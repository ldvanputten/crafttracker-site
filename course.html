<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CraftTracker Crochet Course</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fdfcfb;
    --fg: #1c1a1d;
    --muted: #6b6570;
    --accent: #7c5cbf;
    --rule: #e6e2e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17151a;
      --fg: #f2f0f4;
      --muted: #a49dae;
      --accent: #b39ddb;
      --rule: #2c2832;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }
  h1 { font-size: 28px; margin: 0 0 4px; }
  h2 { font-size: 19px; margin: 40px 0 16px; }
  p, li { color: var(--fg); }
  a { color: var(--accent); }

  #gate {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 320px;
  }
  #gate input {
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--bg);
    color: var(--fg);
  }
  #gate button {
    padding: 10px 16px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--bg);
    cursor: pointer;
  }
  #gate-error { color: #c0392b; font-size: 14px; min-height: 18px; }

  .videos { display: grid; gap: 24px; margin-bottom: 8px; }
  .video .label { font-weight: 600; margin: 0 0 8px; color: var(--muted); font-size: 14px; }
  .embed { position: relative; width: 100%; padding-top: 56.25%; border-radius: 8px; overflow: hidden; background: var(--rule); }
  .embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .guides { padding-left: 22px; }

  #content { display: none; }
</style>
</head>
<body>
<main>
  <h1>Crochet Course</h1>

  <div id="gate">
    <p>This page is for CraftTracker crochet course students. Enter the course password to continue.</p>
    <input id="password" type="password" placeholder="Password" autocomplete="off">
    <button id="unlock">Unlock</button>
    <p id="gate-error"></p>
  </div>

  <div id="content"></div>
</main>

};

function b64ToBytes(b64) {
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

async function tryUnlock(password) {
  const errorEl = document.getElementById('gate-error');
  errorEl.textContent = '';
  try {
    const enc = new TextEncoder();
    const salt = b64ToBytes(PAYLOAD.salt);
    const iv = b64ToBytes(PAYLOAD.iv);
    const ciphertext = b64ToBytes(PAYLOAD.ciphertext);
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
    const html = new TextDecoder().decode(plainBuf);
    document.getElementById('content').innerHTML = html;
    document.getElementById('content').style.display = 'block';
    document.getElementById('gate').style.display = 'none';
  } catch (e) {
    errorEl.textContent = 'Incorrect password.';
  }
}

document.getElementById('unlock').addEventListener('click', () => {
  tryUnlock(document.getElementById('password').value);
});
document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') tryUnlock(document.getElementById('password').value);
});
</script>

</html>
