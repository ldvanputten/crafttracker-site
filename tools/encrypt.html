<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Course page encryptor (local tool, not published)</title>
<style>
  body { font: 15px/1.5 -apple-system, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
  textarea { width: 100%; height: 300px; font-family: ui-monospace, monospace; font-size: 13px; }
  input { width: 100%; padding: 8px; font-size: 15px; margin: 8px 0; }
  button { padding: 10px 16px; font-size: 15px; cursor: pointer; }
  pre { white-space: pre-wrap; word-break: break-all; background: #f4f4f4; padding: 12px; border-radius: 6px; }
  label { font-weight: 600; display: block; margin-top: 16px; }
</style>
</head>
<body>
<h1>Encrypt course page content</h1>
<p>Local tool only — never publish this file. Paste the HTML to protect, set the password, click Encrypt, then copy the three output values into <code>course.html</code>'s <code>PAYLOAD</code> constant.</p>

<label for="content">Content HTML</label>
<textarea id="content"></textarea>

<label for="password">Password</label>
<input id="password" type="text" placeholder="Enter the course password">

<button id="go">Encrypt</button>

<pre id="out"></pre>

<script>
async function encrypt(plaintext, password) {
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt']
  );
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(plaintext));
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  return { salt: b64(salt), iv: b64(iv), ciphertext: b64(ciphertext) };
}

document.getElementById('go').addEventListener('click', async () => {
  const content = document.getElementById('content').value;
  const password = document.getElementById('password').value;
  const result = await encrypt(content, password);
  document.getElementById('out').textContent = JSON.stringify(result, null, 2);
});
</script>
</body>
</html>
